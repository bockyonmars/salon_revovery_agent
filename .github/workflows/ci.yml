name: Local release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts, golden eval, build, and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the production Node release
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the local release gate
        run: npm run release:validate:local

      - name: Build the immutable production image
        run: docker build --tag salon-recovery-agent:${{ github.sha }} .
