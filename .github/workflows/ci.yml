name: Local release gate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Contracts, golden eval, build, and image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the candidate commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Use the production Node release
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.23.1
          package-manager-cache: false

      - name: Install the locked dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run the local release gate
        run: npm run release:validate:local

      - name: Build the immutable production image
        run: docker build --tag salon-recovery-agent:${{ github.sha }} .
